    <rect width="1200" height="380" fill="url(#dots)"/>
    <text x="64" y="104" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">.NET REFLECTION TOOLKIT</text><text x="64" y="176" class="s" font-size="68" font-weight="800" letter-spacing="-2" fill="#FAFFFD">Reflector<tspan fill="#FF5A73">Net</tspan></text><text x="64" y="226" class="s" font-size="22" fill="#A8C2D2">Live objects to JSON and back,</text><text x="64" y="258" class="s" font-size="22" fill="#A8C2D2">JSON Schema and method calls for AI agents.</text><g transform="translate(64 304)"><rect width="169" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="84.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">netstandard2.1</text></g><g transform="translate(243 304)"><rect width="91" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="45.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">net8.0</text></g><g transform="translate(344 304)"><rect width="91" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="45.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">net9.0</text></g><circle cx="688" cy="190" r="68.4" fill="url(#logoGlow)"/><circle class="spin" cx="688" cy="190" r="72.2" fill="none" stroke="#FF5A73" stroke-opacity=".35" stroke-dasharray="2 10"/><circle class="spin r" cx="688" cy="190" r="92.72" fill="none" stroke="#6FA8D0" stroke-opacity=".25" stroke-dasharray="36 18"/><g class="pulse"><g transform="translate(613.17 117.65) scale(0.1462)"><path d="M512 194 L512 504 L366 785 L185 785 Z" fill="url(#logoL)"/><path d="M512 194 L839 785 L658 785 L512 504 Z" fill="url(#logoR)"/><path d="M512 194 L512 294 L223 767 L185 785 Z" fill="url(#logoB)"/></g></g><rect x="820" y="56" width="360" height="272" rx="14" fill="#070D14" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><rect x="820" y="56" width="360" height="40" rx="14" fill="#0D1A25"/><rect x="820" y="82" width="360" height="14" fill="#0D1A25"/><rect x="820" y="96" width="360" height="1" fill="rgba(111,168,208,0.16)"/><circle cx="842" cy="76" r="6" fill="#FF5F57"/><circle cx="862" cy="76" r="6" fill="#FEBC2E"/><circle cx="882" cy="76" r="6" fill="#28C840"/><text x="1162" y="82" text-anchor="end" class="m" font-size="16" fill="#8AA6B8">Program.cs</text><text x="838" y="130" class="m" font-size="16"><tspan fill="#FF5A73">› </tspan><tspan fill="#FAFFFD">reflector.Serialize(player)</tspan></text><text x="838" y="159" class="m" font-size="16"><tspan fill="#FAFFFD">{ </tspan><tspan fill="#A5C8E4">&quot;name&quot;</tspan><tspan fill="#FAFFFD">: </tspan><tspan fill="#F5D08A">&quot;player&quot;</tspan><tspan fill="#FAFFFD">,</tspan></text><text x="838" y="188" class="m" font-size="16"><tspan fill="#FAFFFD">  </tspan><tspan fill="#A5C8E4">&quot;typeName&quot;</tspan><tspan fill="#FAFFFD">: </tspan><tspan fill="#F5D08A">&quot;Player&quot;</tspan><tspan fill="#FAFFFD">,</tspan></text><text x="838" y="217" class="m" font-size="16"><tspan fill="#FAFFFD">  </tspan><tspan fill="#A5C8E4">&quot;props&quot;</tspan><tspan fill="#FAFFFD">: [ { </tspan><tspan fill="#A5C8E4">&quot;name&quot;</tspan><tspan fill="#FAFFFD">: </tspan><tspan fill="#F5D08A">&quot;Level&quot;</tspan><tspan fill="#FAFFFD">,</tspan></text><text x="838" y="246" class="m" font-size="16"><tspan fill="#FAFFFD">      </tspan><tspan fill="#A5C8E4">&quot;value&quot;</tspan><tspan fill="#FAFFFD">: </tspan><tspan fill="#F59AB0">7</tspan><tspan fill="#FAFFFD"> }, … ] }</tspan></text><text x="838" y="275" class="m" font-size="16"><tspan fill="#FF5A73">› </tspan><tspan fill="#FAFFFD">reflector.MethodCall(…</tspan><tspan fill="#F5D08A">&quot;Buy&quot;</tspan><tspan fill="#FAFFFD">…)</tspan></text><text x="838" y="304" class="m" font-size="16"><tspan fill="#22C55E">[Success] </tspan><tspan fill="#F5D08A">&quot;Bought 2 x potion&quot;</tspan></text><rect class="blink" x="1118" y="289" width="9" height="19" fill="#FAFFFD"/>
    <rect x="0" y="378" width="1200" height="2" fill="url(#rule)"/>
