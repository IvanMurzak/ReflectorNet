<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="ReflectorNet flow: a live .NET object is serialized to SerializedMember JSON and changed back in place; types and methods produce JSON Schema; an AI agent reads the JSON and the schema and sends patches and JSON method calls that ReflectorNet finds and invokes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="logoL" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8395AD"/></linearGradient>
    <linearGradient id="logoR" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#E1E8F1"/><stop offset="1" stop-color="#455974"/></linearGradient>
    <linearGradient id="logoB" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#AABBD0"/></linearGradient>
    <radialGradient id="logoGlow"><stop offset="0" stop-color="#6FA8D0" stop-opacity=".18"/><stop offset="1" stop-color="#6FA8D0" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="470" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="470" fill="url(#bg)"/><rect width="1200" height="470" fill="url(#hzR)"/><rect width="1200" height="470" fill="url(#hzB)"/>
    <rect width="1200" height="470" fill="url(#dots)"/>
    <text x="40" y="56" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">HOW IT WORKS</text><rect x="40" y="96" width="256" height="128" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="108" width="3" height="104" rx="1.5" fill="#6FA8D0"/><text x="62" y="156.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Live object</text><text x="62" y="182.0" class="s" font-size="16" fill="#8AA6B8">your .NET instance</text><text x="62" y="204.0" class="s" font-size="16" fill="#8AA6B8">TryModifyAt · TryPatch</text><rect x="328" y="96" width="256" height="128" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="328" y="108" width="3" height="104" rx="1.5" fill="#FF5A73"/><text x="350" y="156.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">SerializedMember</text><text x="350" y="182.0" class="s" font-size="16" fill="#8AA6B8">JSON with type names</text><text x="350" y="204.0" class="s" font-size="16" fill="#8AA6B8">Serialize · Deserialize</text><rect x="616" y="96" width="256" height="128" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="616" y="108" width="3" height="104" rx="1.5" fill="#EAB308"/><text x="638" y="156.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">JSON Schema</text><text x="638" y="182.0" class="s" font-size="16" fill="#8AA6B8">of types and arguments</text><text x="638" y="204.0" class="s" font-size="16" fill="#8AA6B8">GetArgumentsSchema</text><rect x="904" y="96" width="256" height="128" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="904" y="108" width="3" height="104" rx="1.5" fill="#22C55E"/><text x="926" y="156.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Method call</text><text x="926" y="182.0" class="s" font-size="16" fill="#8AA6B8">MethodRef + JSON args</text><text x="926" y="204.0" class="s" font-size="16" fill="#8AA6B8">FindMethod · MethodCall</text><path id="w1" d="M298 148.0 H326" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle><path id="w2" d="M586 148.0 H614" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-0.5s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle><path id="w3" d="M874 148.0 H902" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-1.0s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle><rect x="40" y="340" width="1120" height="96" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><text x="58" y="384.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">AI agent or tool host</text><text x="58" y="410.0" class="s" font-size="16" fill="#8AA6B8">reads state as JSON · learns argument shapes from the schema · sends patches and calls</text><path id="w4" d="M168.0 228 V336" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.4s" begin="-0.0s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#w4"/></animateMotion></circle><text x="180.0" y="288" class="m" font-size="16" fill="#8AA6B8">patch</text><path id="w5" d="M456.0 228 V336" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.4s" begin="-0.3s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle><text x="468.0" y="288" class="m" font-size="16" fill="#8AA6B8">read</text><path id="w6" d="M744.0 228 V336" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.4s" begin="-0.6s" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle><text x="756.0" y="288" class="m" font-size="16" fill="#8AA6B8">schema</text><path id="w7" d="M1032.0 228 V336" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.4s" begin="-0.8999999999999999s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#w7"/></animateMotion></circle><text x="1044.0" y="288" class="m" font-size="16" fill="#8AA6B8">call</text>
    <rect x="0" y="468" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="469" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
</svg>
