  TypeName = </tspan><tspan class="gr">"Shop"</tspan><tspan class="tx">,</tspan></text><text x="936" y="192" class="mono" font-size="12.5" xml:space="preserve"><tspan class="tx">  MethodName = </tspan><tspan class="gr">"Buy"</tspan><tspan class="tx"> }</tspan></text><text x="936" y="212" class="mono" font-size="12.5" xml:space="preserve"><tspan class="tx">→ </tspan><tspan class="gr">[Success]</tspan></text><text x="936" y="232" class="mono" font-size="12.5" xml:space="preserve"><tspan class="tx">  </tspan><tspan class="gr">"Bought 2 x potion"</tspan></text><text x="936" y="276" class="sans gr" font-size="12.5" font-weight="600">FindMethod · MethodCall</text><line x1="286" y1="183.0" x2="322" y2="183.0" class="smu" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah)"/><circle r="3.5" class="ac" cx="290" cy="174.0"><animate attributeName="cx" values="290;318" dur="1.6s" begin="0.0s" repeatCount="indefinite"/></circle><line x1="582" y1="183.0" x2="618" y2="183.0" class="smu" stroke-width="1.6" marker-end="url(#ah)"/><circle r="3.5" class="ac" cx="586" cy="174.0"><animate attributeName="cx" values="586;614" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></circle><line x1="878" y1="183.0" x2="914" y2="183.0" class="smu" stroke-width="1.6" marker-end="url(#ah)"/><circle r="3.5" class="ac" cx="882" cy="174.0"><animate attributeName="cx" values="882;910" dur="1.6s" begin="1.0s" repeatCount="indefinite"/></circle><rect x="32" y="360" width="1136" height="62" rx="12" class="card2 bd" stroke-width="1.2"/><text x="600" y="387" text-anchor="middle" class="sans tx" font-size="16" font-weight="700">AI agent or tool host</text><text x="600" y="408" text-anchor="middle" class="sans mu" font-size="13">reads state as JSON · learns argument shapes from the schema · sends patches and method calls as JSON</text><line x1="156" y1="298" x2="156" y2="356" class="smu" stroke-width="1.4" stroke-dasharray="4 4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="168" y="331"