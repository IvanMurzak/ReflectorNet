name: Release

# Releases ONLY by a manual dispatch (owner directive 2026-09-16). Merging a version bump to
# `main` publishes nothing. Order: guard -> full tests + pack -> NuGet publish (deploy.yml via
# workflow_call; its NuGet Trusted Publishing binding is exercised through THIS caller, as before)
# -> verify the version is live on NuGet -> tag + GitHub Release. The tag is created only after
# the package is verified live, so a re-dispatch after a failed publish/verify is always possible
# (the NuGet push is --skip-duplicate).
#
#   gh workflow run release.yml -R IvanMurzak/ReflectorNet --ref main -f dry_run=true
#   gh workflow run release.yml -R IvanMurzak/ReflectorNet --ref main -f dry_run=false
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every test and build job, publish NOTHING (no NuGet push, no tag, no GitHub Release)."
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Optional markdown appended to the generated GitHub Release body."
        required: false
        default: ""
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  check-version-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      prev_version: ${{ steps.prev_version.outputs.tag }}
    steps:
      - name: Ref guard
        if: inputs.dry_run != true && github.ref != 'refs/heads/main'
        run: |
          echo "::error::A real release must be dispatched on refs/heads/main (got '${{ github.ref }}'). Use dry_run=true on other refs."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from ReflectorNet.csproj
        id: get_version
        shell: bash
        run: |
          version=$(grep -oP '<Version>\K[^<]+' ReflectorNet/ReflectorNet.csproj)
          if [ -z "$version" ]; then
            echo "::error::Could not read <Version> from ReflectorNet/ReflectorNet.csproj"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Found version: $version"

      - name: Find previous version tag
        id: prev_version
        uses: WyriHaximus/github-action-get-previous-tag@v2

      - name: Check if tag exists
        id: version_exists
        uses: mukunku/tag-exists-action@v1.7.0
        with:
          tag: ${{ steps.get_version.outputs.version }}

      # ReflectorNet tags are the bare version (e.g. `5.4.0`, no `v` prefix) — kept as-is.
      - name: Version guard
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          TAG_EXISTS: ${{ steps.version_exists.outputs.exists }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$TAG_EXISTS" = "true" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::Tag '$VERSION' already exists. Dry run continues (a real run would fail here). Bump <Version> before a real release."
            else
              echo "::error::Tag '$VERSION' already exists: version $VERSION is already released. Bump <Version> in ReflectorNet/ReflectorNet.csproj on main, then dispatch again."
              exit 1
            fi
          else
            echo "Version tag '$VERSION' does not exist. Proceeding (dry_run=$DRY_RUN)."
          fi

  build-and-test:
    runs-on: ubuntu-latest
    needs: check-version-tag
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release --logger trx

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/TestResults/*.trx"
          check_name: "Test Results"
          large_files: true

      # Same pack command as deploy.yml, so a dry run proves the package builds under the exact
      # file name the publish step expects. The package is NOT uploaded or pushed from here.
      - name: Pack (verify)
        shell: bash
        env:
          VERSION: ${{ needs.check-version-tag.outputs.version }}
        run: |
          dotnet pack ReflectorNet/ReflectorNet.csproj --no-build --configuration Release --output ./packages
          nupkg_file="./packages/com.IvanMurzak.ReflectorNet.${VERSION}.nupkg"
          if [ ! -f "$nupkg_file" ]; then
            echo "::error::Expected .nupkg file not found: $nupkg_file"
            ls -la ./packages || true
            exit 1
          fi
          echo "Packed: $nupkg_file"

  deploy:
    needs: [check-version-tag, build-and-test]
    if: inputs.dry_run != true
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.check-version-tag.outputs.version }}

  # Moved in from the local release pipeline (wait-release-and-nuget.py): the run is green only
  # when the version is actually listed in the NuGet v3 flat-container index.
  verify-nuget:
    runs-on: ubuntu-latest
    needs: [check-version-tag, deploy]
    if: inputs.dry_run != true
    timeout-minutes: 20
    steps:
      - name: Wait for version on NuGet
        shell: bash
        env:
          VERSION: ${{ needs.check-version-tag.outputs.version }}
          PACKAGE_ID: com.IvanMurzak.ReflectorNet
          CAP_SECONDS: "900"
          INTERVAL_SECONDS: "30"
        run: |
          pid=$(printf '%s' "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')
          want=$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')
          url="https://api.nuget.org/v3-flatcontainer/${pid}/index.json"
          deadline=$(( $(date +%s) + CAP_SECONDS ))
          while :; do
            body=$(curl -sS --retry 3 --retry-delay 5 -w '\n%{http_code}' "$url") || body=$'\ncurl-error'
            status=${body##*$'\n'}
            json=${body%$'\n'*}
            if [ "$status" = "200" ] && printf '%s' "$json" | jq -e --arg v "$want" '.versions | map(ascii_downcase) | index($v) != null' > /dev/null; then
              echo "NuGet: $PACKAGE_ID $VERSION is listed in $url"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$PACKAGE_ID $VERSION not listed in $url after ${CAP_SECONDS}s (last status: $status). deploy succeeded, so this is indexing lag or a publish problem; verify on nuget.org, then re-dispatch (the push is --skip-duplicate)."
              exit 1
            fi
            echo "NuGet: $VERSION not listed yet (status $status); retrying in ${INTERVAL_SECONDS}s"
            sleep "$INTERVAL_SECONDS"
          done
          nuspec="https://api.nuget.org/v3-flatcontainer/${pid}/${want}/${pid}.nuspec"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$nuspec" || true)
          echo "nuspec snapshot (informational): HTTP $code for $nuspec"

  publish-release:
    runs-on: ubuntu-latest
    needs: [check-version-tag, build-and-test, deploy, verify-nuget]
    if: inputs.dry_run != true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release description
        id: rel_desc
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -e
          version=${{ needs.check-version-tag.outputs.version }}
          prev_version=${{ needs.check-version-tag.outputs.prev_version }}
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          today=$(date +'%B %e, %Y')

          echo "repo_url: $repo_url"
          echo "today: $today"

          echo "# ReflectorNet $version" > release.md
          echo "**Released:** *$today*" >> release.md

          echo "" >> release.md
          echo "---" >> release.md
          echo "" >> release.md

          if [ -n "$prev_version" ]; then
            echo "## Comparison" >> release.md
            echo "See every change: [Compare $prev_version...$version]($repo_url/compare/$prev_version...$version)" >> release.md

            echo "" >> release.md
            echo "---" >> release.md
            echo "" >> release.md

            echo "## Commit Summary (Newest → Oldest)" >> release.md
            for sha in $(git log --pretty=format:'%H' $prev_version..HEAD); do
              username=$(gh api repos/${GITHUB_REPOSITORY}/commits/$sha --jq '.author.login // .commit.author.name')
              message=$(git log -1 --pretty=format:'%s' $sha)
              short_sha=$(git log -1 --pretty=format:'%h' $sha)
              echo "- [\`$short_sha\`]($repo_url/commit/$sha) — $message by @$username" >> release.md
            done
          fi

          if [ -n "$RELEASE_NOTES" ]; then
            echo "" >> release.md
            echo "---" >> release.md
            echo "" >> release.md
            printf '%s\n' "$RELEASE_NOTES" >> release.md
          fi

          printf "release_body<<ENDOFRELEASEBODY\n%s\nENDOFRELEASEBODY\n" "$(cat release.md)" >> $GITHUB_OUTPUT

      - name: Create Tag and Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version-tag.outputs.version }}
          name: ${{ needs.check-version-tag.outputs.version }}
          body: ${{ steps.rel_desc.outputs.release_body }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
